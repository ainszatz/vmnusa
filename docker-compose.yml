services:
  prometheus:
    image: prom/prometheus:latest
    container_name: nusabackup-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    depends_on:
      - pve-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: nusabackup-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: nusabackup-pve-exporter
    restart: unless-stopped
    volumes:
      - ./prometheus/pve.yml:/etc/prometheus/pve.yml:ro
    environment:
      PVE_EXPORTER_CONFIG_FILE: /etc/prometheus/pve.yml
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nusabackup-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)"
    networks:
      - monitoring

  backup-job-exporter:
    build: ./exporters/backup-job-exporter
    container_name: nusabackup-backup-job-exporter
    restart: unless-stopped
    volumes:
      - ./exporters/backup-job-exporter/status:/status:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: nusabackup-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      PROMETHEUS_URL: ${PROMETHEUS_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
