global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: nusabackup

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Alertmanager wiring lands in Fase 5 (PRD section 10) — left empty for now.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pve
    static_configs:
      # Ganti dengan hostname/IP node Proxmox asli sebelum deploy.
      - targets: ["pve1.example.local"]
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
      - target_label: node
        replacement: pve1
