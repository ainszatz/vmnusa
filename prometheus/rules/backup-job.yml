groups:
  - name: backup-job
    rules:
      - alert: BackupJobFailed
        expr: nusabackup_backup_job_status == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup job {{ $labels.job_name }} gagal"

      - alert: BackupJobFailedConsecutive
        expr: nusabackup_backup_job_consecutive_failures >= 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backup job {{ $labels.job_name }} gagal {{ $value }}x berturut-turut"

      - alert: BackupJobLate
        expr: nusabackup_backup_job_last_success_timestamp_seconds > 0 and (time() - nusabackup_backup_job_last_success_timestamp_seconds) > 7200
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup job {{ $labels.job_name }} terlambat >2 jam dari sukses terakhir"

      - alert: BackupJobVeryLate
        expr: nusabackup_backup_job_last_success_timestamp_seconds > 0 and (time() - nusabackup_backup_job_last_success_timestamp_seconds) > 21600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backup job {{ $labels.job_name }} terlambat >6 jam dari sukses terakhir"

      - alert: BackupJobNeverSucceeded
        expr: nusabackup_backup_job_last_success_timestamp_seconds == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup job {{ $labels.job_name }} belum pernah sukses sejak mulai dipantau"
